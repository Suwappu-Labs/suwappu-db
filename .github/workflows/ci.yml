name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace
        env:
          PROPTEST_CASES: 100  # Fast path: fewer iterations

  property-tests:
    name: Property Tests (10k iterations)
    runs-on: ubuntu-latest
    # Track 2.1: 10k cases is the load-bearing claim for every invariant
    # in this repo; running it post-merge only lets a regression land on
    # main before anyone notices. Now runs on every PR and push.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78

      - uses: Swatinem/rust-cache@v2

      - name: Run property tests
        run: cargo test --workspace --release
        env:
          PROPTEST_CASES: 10000

      - name: Run property tests (production-pqc feature)
        run: cargo test --workspace --release --features gsxdb-bridge/production-pqc
        env:
          PROPTEST_CASES: 10000

  check-lane:
    name: Lane Separation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check lane separation invariant
        run: |
          if [ ! -f scripts/check-lane-separation.sh ]; then
            echo "Lane separation script not found"
            exit 1
          fi
          bash scripts/check-lane-separation.sh

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          log-level: warn

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: gsxdb-server:${{ github.sha }},gsxdb-server:latest

  # Optional: Push to ECR on main branch
  push-ecr:
    name: Push to ECR (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-docker
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          registry: 905418423235.dkr.ecr.us-east-1.amazonaws.com
          tags: |
            905418423235.dkr.ecr.us-east-1.amazonaws.com/gsxdb-server:latest
            905418423235.dkr.ecr.us-east-1.amazonaws.com/gsxdb-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
