name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  RUST_BACKTRACE: 1
  # Force cargo to fetch git dependencies through the git CLI so the
  # credential injected by the "Authenticate to private gsx-revm
  # dependency" step (url.insteadOf with GSX_REVM_TOKEN) is honored.
  # gsx-revm is a private repo; without this, every cargo job fails at
  # dependency-resolution time even when the feature that pulls it is off.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88

      - uses: Swatinem/rust-cache@v2

      - name: Authenticate to private gsx-revm dependency
        run: >
          git config --global
          url."https://x-access-token:${{ secrets.GSX_REVM_TOKEN }}@github.com/GlobalSettlementNetwork/gsx-revm".insteadOf
          "https://github.com/GlobalSettlementNetwork/gsx-revm"

      - name: Run tests
        run: cargo test --workspace
        env:
          PROPTEST_CASES: 100  # Fast path: fewer iterations

  property-tests:
    name: Property Tests (10k iterations)
    runs-on: ubuntu-latest
    # Track 2.1: 10k cases is the load-bearing claim for every invariant
    # in this repo; running it post-merge only lets a regression land on
    # main before anyone notices. Now runs on every PR and push.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88

      - uses: Swatinem/rust-cache@v2

      - name: Authenticate to private gsx-revm dependency
        run: >
          git config --global
          url."https://x-access-token:${{ secrets.GSX_REVM_TOKEN }}@github.com/GlobalSettlementNetwork/gsx-revm".insteadOf
          "https://github.com/GlobalSettlementNetwork/gsx-revm"

      - name: Run property tests
        run: cargo test --workspace --release
        env:
          PROPTEST_CASES: 10000

      - name: Run property tests (production-pqc feature)
        run: cargo test --workspace --release --features gsxdb-bridge/production-pqc
        env:
          PROPTEST_CASES: 10000

  check-lane:
    name: Lane Separation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check lane separation invariant
        run: |
          if [ ! -f scripts/check-lane-separation.sh ]; then
            echo "Lane separation script not found"
            exit 1
          fi
          bash scripts/check-lane-separation.sh

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    # Runs cargo-deny natively (not the containerized action) so the
    # git credential for the private gsx-revm dependency, injected on the
    # host runner below, is available to `cargo metadata`. The action
    # runs in its own container where the host git-config isn't visible.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88

      - uses: Swatinem/rust-cache@v2

      - name: Authenticate to private gsx-revm dependency
        run: >
          git config --global
          url."https://x-access-token:${{ secrets.GSX_REVM_TOKEN }}@github.com/GlobalSettlementNetwork/gsx-revm".insteadOf
          "https://github.com/GlobalSettlementNetwork/gsx-revm"

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: cargo deny check
        run: cargo deny check

  revm-executor:
    name: revm EVM executor (production-evm-executor)
    runs-on: ubuntu-latest
    # Builds + tests the real revm-backed EVM executor (gsx-revm / revm 34).
    # Feature-gated out of the default matrix because it pulls revm + alloy +
    # C crypto deps (c-kzg/blst/secp256k1); enforced here so the real EVM
    # executor can't silently regress on main.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88

      - uses: Swatinem/rust-cache@v2

      - name: Authenticate to private gsx-revm dependency
        run: >
          git config --global
          url."https://x-access-token:${{ secrets.GSX_REVM_TOKEN }}@github.com/GlobalSettlementNetwork/gsx-revm".insteadOf
          "https://github.com/GlobalSettlementNetwork/gsx-revm"

      - name: test gsxdb-bridge (production-evm-executor)
        run: cargo test -p gsxdb-bridge --features production-evm-executor --lib --test revm_move_parity

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: gsxdb-server:${{ github.sha }},gsxdb-server:latest

  # Optional: Push to ECR on main branch
  push-ecr:
    name: Push to ECR (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-docker
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          registry: 905418423235.dkr.ecr.us-east-1.amazonaws.com
          tags: |
            905418423235.dkr.ecr.us-east-1.amazonaws.com/gsxdb-server:latest
            905418423235.dkr.ecr.us-east-1.amazonaws.com/gsxdb-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
