blank_issues_enabled: false
contact_links:
  - name: Security vulnerability — private disclosure
    url: https://github.com/Suwappu-Labs/suwappu-db/security/advisories/new
    about: |
      Do NOT file public issues for security vulnerabilities.
      Use GitHub's private security advisory channel, or email
      layerinfinite@gmail.com per SECURITY.md.

  - name: Integration question — how do I do X?
    url: https://github.com/Suwappu-Labs/suwappu-db/discussions
    about: |
      "How do I depend on suwappudb-types?", "what's the RPC method
      for Y?", "is feature Z planned?" — open a Discussion, not
      an Issue. Read INTEGRATORS.md first.

  - name: Read the integration guide
    url: https://github.com/Suwappu-Labs/suwappu-db/blob/main/INTEGRATORS.md
    about: |
      Stability promises, front-door types, worked example,
      known gaps. Most "how do I" questions are answered here.
