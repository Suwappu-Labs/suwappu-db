# cargo-deny config — supply-chain checks run by /check and CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Vulnerability + yanked-crate checks. Pulls from the RustSec advisory DB.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # rustls-pemfile is unmaintained; pulled transitively via ureq -> rustls.
    # No vulnerability — just maintenance status. Removing requires a ureq
    # upgrade beyond what gsxdb-bridge currently pins.
    "RUSTSEC-2025-0134",
    # paste is unmaintained; pulled transitively via the crypto crates
    # (pqcrypto / ml-dsa derive macros). No vulnerability — proc-macro
    # used at build time only. Upstream replacements are still WIP.
    "RUSTSEC-2024-0436",
    # derivative crate unmaintained; pulled transitively via Aptos
    # move-vm-types. No vulnerability — derive-macro used at build time
    # only. Aptos has discussed migrating to derive_more / derive-where
    # but no release yet. Will drop once Aptos migrates upstream.
    "RUSTSEC-2024-0388",
    # fxhash unmaintained; pulled transitively via Aptos move-vm-runtime.
    # No vulnerability — fast non-cryptographic hash used in the
    # interpreter's hot path. Aptos can swap to rustc-hash but hasn't.
    # Will drop once Aptos migrates upstream.
    "RUSTSEC-2025-0057",
]

[licenses]
# Permissive OSS licenses we accept across the dependency tree.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "Unlicense",
    # webpki-roots (Mozilla CA bundle) — permissive data-license, not OSS code.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

# Clarifications — for crates that don't declare a `license` field in
# their own Cargo.toml but are licensed via their workspace root or
# LICENSE files. Without these, cargo-deny errors with "unlicensed".
[[licenses.clarify]]
# banderwagon (crate-crypto/rust-verkle) — workspace root declares
# `license = "MIT"`. Repo root carries LICENSE-MIT and LICENSE-APACHE.
name = "banderwagon"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "ipa-multipoint"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal crates declare each other via `version = "*"` + `path = "..."`.
# That's fine for unpublished crates; only path-less wildcards are real risks.
allow-wildcard-paths = true
highlight = "all"
# No banned crates by default. If a future incident calls for one, add it
# here with a `reason` and a link to the IQ that drove the decision.
deny = []
skip = []
skip-tree = []

[sources]
# Only crates.io is allowed. Git deps require an explicit allow-listing.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # S9.5b: aptos-core Move VM crates. Not usefully published on
    # crates.io (only move-core-types = "0.0.3" from 2021).
    # Pinned by tag in gsxdb-state's Cargo.toml.
    "https://github.com/aptos-labs/aptos-core",
    # S9.5b: aptos-labs/bcs is a transitive dep of move-core-types.
    # Aptos's fork of zefchain/bcs pinned to a specific rev. Pulled
    # implicitly via aptos-core; we list it explicitly for cargo-deny.
    "https://github.com/aptos-labs/bcs.git",
    # S10.1: crate-crypto/rust-verkle — Ethereum Foundation's
    # reference Verkle implementation (banderwagon curve + IPA
    # multipoint). Not on crates.io. Pinned by rev in gsxdb-state's
    # Cargo.toml. Pulled in only with `production-verkle`.
    "https://github.com/crate-crypto/rust-verkle",
]
