[workspace]
resolver = "2"
members = [
    "crates/gsxdb-state",
    "crates/gsxdb-bridge",
    "crates/gsxdb-lane", "crates/gsxdb-server",
    "crates/gsxdb-types",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/GlobalSettlementNetwork/gsx-db"
# Not publishing to crates.io; gsxdb-* crates are internal. Required so
# cargo-deny `allow-wildcard-paths` treats workspace-internal `version = "*"`
# deps as paths rather than crates.io references.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
