[workspace]
resolver = "2"
members = [
    "crates/suwappudb-state",
    "crates/suwappudb-bridge",
    "crates/suwappudb-lane", "crates/suwappudb-server",
    "crates/suwappudb-types",
]

[workspace.package]
# C2: workspace version. Bumped 0.0.1 → 0.1.0-pre at the
# Pass-A close so the first release tag (`v0.1.0-pre`) marks
# Phase-1 launch readiness. SemVer kicks in at `v1.0.0`; until then
# minor bumps may include breaking changes, per the INTEGRATORS.md
# stability promises.
version = "0.1.0-pre"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/Suwappu-Labs/suwappu-db"
# Not publishing to crates.io; suwappudb-* crates are internal. Required so
# cargo-deny `allow-wildcard-paths` treats workspace-internal `version = "*"`
# deps as paths rather than crates.io references.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
