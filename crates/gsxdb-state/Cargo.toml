[package]
name = "gsxdb-state"
description = "Authoritative state lane — owns balances, anchors, and cross-VM projections. Mutated only via gsxdb-bridge."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Storage backend: redb (pure-Rust) for dev/CI per IQ-1.
# Production switches to RocksDB in S8 behind the `production-storage` feature.
redb = "2"
# State-tree commitment hash. Per IQ-6, hash-based commitment now;
# real Verkle (polynomial commitments over banderwagon) is a launch-
# readiness item.
blake3 = "1"
# Hex encoding/decoding for address serialization (S9)
hex = "0.4"
# Serialization for snapshots and JSON metadata (S12)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Move VM execution strategy.
# Default (none): mock executor for Phase 1.
# production-move-executor: real Aptos move-vm-runtime (S9+).
production-move-executor = []

# Commitment scheme strategy.
# Default (none): hash-based (BLAKE3) for Phase 1.
# production-verkle: real Verkle with IPA for S10+.
production-verkle = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
