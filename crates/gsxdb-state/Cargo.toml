[package]
name = "gsxdb-state"
description = "Authoritative state lane — owns balances, anchors, and cross-VM projections. Mutated only via gsxdb-bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Storage backend: redb (pure-Rust) for dev/CI per IQ-1.
# Production switches to RocksDB in S8 behind the `production-storage` feature.
redb = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
