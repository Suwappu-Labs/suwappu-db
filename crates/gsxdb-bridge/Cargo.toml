[package]
name = "gsxdb-bridge"
description = "The only legitimate path from data lane (gsxdb-lane) to authoritative state (gsxdb-state). Validates intents and applies state changes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
gsxdb-state = { path = "../gsxdb-state" }
# Work-stealing parallelism for the OCC block executor (S4).
rayon = "1"
# Block hashing for the recovery store (S8).
blake3 = "1"
# Persistent block storage (S8). Same backend as state per IQ-1.
redb = "2"
# Structured logging for sync operations (S9).
tracing = "0.1"
# JSON-RPC calls to op-reth for anchor registry queries (phase-2).
ureq = { version = "2.9", features = ["json"] }
# Async HTTP client for L2 state sync via op-reth.
reqwest = { version = "0.11", features = ["json"] }
# JSON serialization for RPC payloads and responses.
serde_json = "1"
# Hex encoding/decoding for eth_call data and responses.
hex = "0.4"

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
# Keccak256 for Solidity parity testing (Phase 1 placeholder MAC)
sha3 = "0.10"
