[package]
name = "gsxdb-types"
description = "Frozen public-type surface for gsx-db — the subset downstream wallets / indexers / parallel verifiers depend on. Versioned independently from internal crates."
# **C5**: `gsxdb-types` carries its own version so the frozen surface
# can be bumped independently of internal crates. Pre-1.0 minor bumps
# may still include additive changes (new variants, new methods);
# breaking changes require a major bump.
version = "0.1.0-pre"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# **Re-export facade.** This crate is a thin re-export layer over the
# internal crates' frozen surfaces. Downstream `cargo add gsxdb-types`
# gets the stable subset without pulling internal traits or
# implementation details. Internal crates keep their direct imports.
gsxdb-state = { path = "../gsxdb-state" }
gsxdb-bridge = { path = "../gsxdb-bridge" }
