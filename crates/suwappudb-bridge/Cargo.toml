[package]
name = "suwappudb-bridge"
description = "The only legitimate path from data lane (suwappudb-lane) to authoritative state (suwappudb-state). Validates intents and applies state changes."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
suwappudb-state = { path = "../suwappudb-state" }
# Work-stealing parallelism for the OCC block executor (S4).
rayon = "1"
# Block hashing for the recovery store (S8).
blake3 = "1"
# Persistent block storage (S8). Same backend as state per IQ-1.
redb = "2"
# Structured logging for sync operations (S9).
tracing = "0.1"
# JSON-RPC calls to op-reth for anchor registry queries (phase-2).
ureq = { version = "2.9", features = ["json"] }
# Async HTTP client for L2 state sync via op-reth.
reqwest = { version = "0.11", features = ["json"] }
# JSON serialization for RPC payloads and responses.
serde_json = "1"
# Hex encoding/decoding for eth_call data and responses.
hex = "0.4"
# Keccak256 for Solidity-parity payloads (LTPAnchorRegistry, S11).
sha3 = "0.10"
# secp256k1 ECDSA + recovery for AuthScheme::EcdsaSecp256k1 (IQ-7 launch path).
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
# ML-DSA-65 (FIPS 204) for AuthScheme::MlDsa65Hybrid (IQ-7 PQ surface).
# Optional — pulled in only with `--features production-pqc` because the
# C-based pqclean backend is heavy and has cross-compile gotchas under musl.
pqcrypto-mldsa = { version = "0.1", default-features = false, optional = true }
pqcrypto-traits = { version = "0.3", optional = true }

[features]
# Enables the ML-DSA-65 verifier path for AuthScheme::MlDsa65Hybrid.
# Off by default to keep CI fast and avoid the pqclean C build until
# the hybrid AND-gate dispatch (Step D) is ready.
production-pqc = ["dep:pqcrypto-mldsa", "dep:pqcrypto-traits"]
# Propagates suwappudb-state's `production-move-executor` so bridge-side
# integration tests can exercise the real Aptos MoveVM through
# BundleExecutor::execute_with_move_runtime (S9.6).
production-move-executor = ["suwappudb-state/production-move-executor"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
# rand for ECDSA signing key generation in roundtrip tests.
rand = "0.8"
