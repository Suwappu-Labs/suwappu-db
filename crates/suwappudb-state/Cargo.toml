[package]
name = "suwappudb-state"
description = "Authoritative state lane — owns balances, anchors, and cross-VM projections. Mutated only via suwappudb-bridge."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Storage backend: redb (pure-Rust) for dev/CI per IQ-1.
# Production switches to RocksDB in S8 behind the `production-storage` feature.
redb = "2"
# State-tree commitment hash. Per IQ-6, hash-based commitment now;
# real Verkle (polynomial commitments over banderwagon) is a launch-
# readiness item.
blake3 = "1"
# Hex encoding/decoding for address serialization (S9)
hex = "0.4"
# Serialization for snapshots and JSON metadata (S12)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- S9.5b: aptos-core Move VM crates (production-move-executor) ---
#
# Pinned to `aptos-node-v1.44.9-hotfix` — current mainnet stable.
# Not on crates.io; only available from aptos-labs/aptos-core git.
# See `docs/spec/move-execution.md` for the dep-subset rationale.
move-binary-format = { git = "https://github.com/aptos-labs/aptos-core", tag = "aptos-node-v1.44.9-hotfix", optional = true }
move-bytecode-verifier = { git = "https://github.com/aptos-labs/aptos-core", tag = "aptos-node-v1.44.9-hotfix", optional = true }
move-core-types = { git = "https://github.com/aptos-labs/aptos-core", tag = "aptos-node-v1.44.9-hotfix", optional = true }
move-vm-runtime = { git = "https://github.com/aptos-labs/aptos-core", tag = "aptos-node-v1.44.9-hotfix", optional = true }
move-vm-types = { git = "https://github.com/aptos-labs/aptos-core", tag = "aptos-node-v1.44.9-hotfix", optional = true }
# bytes::Bytes is the return shape of the Aptos ModuleBytesStorage +
# ResourceResolver traits. Already in the transitive tree from
# aptos-core but we declare it ourselves so our `use bytes::Bytes`
# in aptos_session.rs resolves explicitly.
bytes = { version = "1", optional = true }

# --- S10.1: Verkle crypto stack (production-verkle) ---
#
# crate-crypto/rust-verkle is the Ethereum Foundation's reference
# Verkle implementation. MIT-licensed, used by EF research + various
# Verkle prototypes. Not on crates.io; only available from git. Same
# git-dep pattern as aptos-core for the Move VM.
#
# banderwagon — the Verkle curve (derived from Bandersnatch).
# ipa-multipoint — IPA polynomial commitment over banderwagon.
# Both are needed to commit and prove against a 256-ary trie node.
banderwagon = { git = "https://github.com/crate-crypto/rust-verkle", rev = "e27b8b4edf1992b4afa636c2fc7983bcc27ddb88", optional = true, default-features = false }
ipa-multipoint = { git = "https://github.com/crate-crypto/rust-verkle", rev = "e27b8b4edf1992b4afa636c2fc7983bcc27ddb88", optional = true }
# Curve-side arithmetic helpers we need at the Verkle scheme layer
# (scalar field, byte ↔ field conversion, point serialization).
# Both come from the arkworks ecosystem; banderwagon/ipa-multipoint
# already depend on these so the version is set by the git pin above.
ark-ff = { version = "0.4", optional = true, default-features = false }
ark-serialize = { version = "0.4", optional = true, default-features = false }

[features]
# Move VM execution strategy.
# Default (none): mock executor for Phase 1.
# production-move-executor: real Aptos move-vm-runtime (S9.5b+).
# Pulls move-binary-format / move-bytecode-verifier / move-vm-runtime
# / move-vm-types / move-core-types from aptos-labs/aptos-core
# (tag aptos-node-v1.44.9-hotfix).
production-move-executor = [
    "dep:bytes",
    "dep:move-binary-format",
    "dep:move-bytecode-verifier",
    "dep:move-core-types",
    "dep:move-vm-runtime",
    "dep:move-vm-types",
]

# Commitment scheme strategy.
# Default (none): hash-based (BLAKE3) for Phase 1.
# production-verkle: real Verkle with IPA for S10+.
# Pulls banderwagon + ipa-multipoint from crate-crypto/rust-verkle
# (pinned by rev) and the matching ark-ff/ark-serialize so the scheme
# layer can move between scalar field and curve points.
production-verkle = [
    "dep:banderwagon",
    "dep:ipa-multipoint",
    "dep:ark-ff",
    "dep:ark-serialize",
]

[dev-dependencies]
proptest = "1"
tempfile = "3"
# Benchmark harness for BENCHMARKS.md numbers (gap item G2). Slim
# feature set: no plotters/csv report generation, results are text.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "state_commit"
harness = false
