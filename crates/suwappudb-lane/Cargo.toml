[package]
name = "suwappudb-lane"
description = "Data lane — mempool, intent queue, untrusted ingest. Reaches state ONLY through suwappudb-bridge. Must NOT depend on suwappudb-state."
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# INVARIANT: suwappudb-lane MUST NOT list suwappudb-state in [dependencies] or
# [dev-dependencies]. The lane-separation script enforces this at build time.
[dependencies]
suwappudb-bridge = { path = "../suwappudb-bridge" }

[dev-dependencies]
